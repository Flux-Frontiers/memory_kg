# pyproject.toml — MemoryKG package configuration (PEP 621)
#
# Author: Eric G. Suchanek, PhD
# Last Revision: 2026-04-25
#
# Build system : Poetry 2.x with PEP 621 [project] table
#
# Quick install (pip)
# -------------------
#   pip install -e ".[dev]"          core + dev tools (pytest, ruff, mypy, etc.)
#   pip install -e ".[viz]"          core + Streamlit/Plotly/PyVis visualizer
#   pip install -e ".[kgdeps]"       core + KG integrations (pycode-kg)
#   pip install -e ".[all]"          everything above
#   pip install -e "."               core runtime only
#
# Quick install (poetry)
# ----------------------
#   poetry install --all-extras      everything
#   poetry install --extras "dev"    core + dev tools only
#   poetry install --extras "viz"    core + visualizer only
#   poetry install --extras "kgdeps" core + KG integrations only
#   poetry install                   core runtime only
#
# First-time setup
# ----------------
#   python -m venv .venv
#   source .venv/bin/activate       # Windows: .venv\Scripts\activate
#   pip install -e ".[dev]"
#
# Run tests
# ---------
#   pytest                          uses pytest.ini (testpaths = tests/)
#   pytest -m "not slow"            skip slow tests
#   pytest --cov=memory_kg          with coverage
#
# Build KG indices (after doc/code changes)
# -----------------------------------------
#   memorykg build --wipe

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
priority = "supplemental"


#[tool.poetry.dependencies]
#kgmodule-utils = {path = "/Users/egs/repos/KG_utils", develop = true}
[tool.poetry]
packages = [{ include = "memory_kg", from = "src" }]

# ---------------------------------------------------------------------------
# PEP 621 project metadata
# ---------------------------------------------------------------------------
[project]
name = "memory-kg"
version = "0.5.0"
description = "A tool to build a semantically searchable knowledge graph from memories"
readme = "README.md"
license = "Elastic-2.0"
authors = [
    { name = "Eric G. Suchanek, PhD", email = "suchanek@mac.com" }
]
keywords = ["knowledge-graph", "document-analysis", "markdown", "lancedb", "sqlite", "semantic-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "click>=8.1.0,<9",
    "einops>=0.8.2",
    "kg-snapshot>=0.3.0",
    "lancedb>=0.29.0",
    "markdown-it-py>=3.0.0",
    "mcp>=1.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0.0",
    "rich>=14.3.3,<15",
    "safetensors>=0.5.0",
    "sentence-transformers>=5.4.1",
    "torch>=2.5.1",
    "transformers>=4.57.6",
    "kgmodule-utils>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "detect-secrets>=1.5.0",
    "mypy>=1.10.0",
    "pdoc>=14.0.0",
    "pre-commit>=4.5.1",
    "pylint>=4.0.5",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]
viz = [
    "plotly>=5.14.0",
    "pyvis>=0.3.2",
    "streamlit>=1.35.0",
]
# note: ftree-kg and agent-kg are not yet on PyPI — install manually from git
kgdeps = [
    "pycode-kg>=0.16.0", "doc-kg>=0.11.0"
]
all = [
    "detect-secrets>=1.5.0",
    "mypy>=1.10.0",
    "pdoc>=14.0.0",
    "plotly>=5.14.0",
    "pre-commit>=4.5.1",
    "pylint>=4.0.5",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pyvis>=0.3.2",
    "ruff>=0.4.0",
    "streamlit>=1.35.0",
]

[project.urls]
Homepage   = "https://github.com/Flux-Frontiers/memory_kg"
Repository = "https://github.com/Flux-Frontiers/memory_kg"

[project.scripts]
memorykg              = "memory_kg.cli.main:cli"
memorykg-analyze      = "memory_kg.cli.cmd_analyze:analyze"
memorykg-build        = "memory_kg.cli.cmd_build:build"
memorykg-build-graph  = "memory_kg.cli.cmd_build:build_graph"
memorykg-build-index  = "memory_kg.cli.cmd_build:build_index"
memorykg-mcp          = "memory_kg.mcp_server:main"
memorykg-pack         = "memory_kg.cli.cmd_query:pack"
memorykg-pipeline     = "memory_kg.cli.cmd_pipeline:pipeline"
memorykg-query        = "memory_kg.cli.cmd_query:query"
memorykg-snapshot     = "memory_kg.cli.cmd_snapshot:snapshot"
memorykg-viz          = "memory_kg.cli.cmd_viz:viz"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------
[tool.ruff]
line-length    = 100
target-version = "py312"
exclude = [".claude"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP",   # baseline: pycodestyle, pyflakes, isort, pyupgrade
    "B",                          # flake8-bugbear (latent bug patterns)
    "SIM",                        # flake8-simplify (clarity)
    "C4",                         # flake8-comprehensions
    "RET",                        # flake8-return
    "PIE",                        # flake8-pie
    "PERF",                       # perflint
    "FURB",                       # refurb (modernization)
    "RUF",                        # ruff-specific rules
    "PLE", "PLW",                 # pylint errors + warnings (skip C/R: too noisy)
]
ignore = [
    "E501",     # line-too-long (formatter handles)
    "RUF001",   # ambiguous unicode in strings (en-dashes are intentional)
    "RUF002",   # ambiguous unicode in docstrings (e.g. "1–6" ranges)
    "SIM113",   # enumerate-for-loop (manual counter is occasionally clearer)
    "PLW0603",  # global-statement (MCP server uses an intentional module singleton)
]

[tool.ruff.lint.per-file-ignores]
# Benchmarks, scripts, and tests are research/eval/glue code — looser rules.
"benchmarks/**"     = ["B", "SIM", "PERF", "FURB", "PLW", "RET", "C4", "RUF005", "RUF059", "E402"]
"scripts/**"        = ["B", "SIM", "PERF", "FURB", "PLW", "RET", "C4", "RUF005"]
"tests/**"          = ["B", "SIM", "PERF", "FURB", "PLW", "RET", "RUF059"]
"generate_wiki.py"  = ["B", "SIM", "PERF", "FURB", "PLW", "RET", "C4", "RUF005"]

[tool.mypy]
python_version        = "3.12"
strict                = false
ignore_missing_imports = true
mypy_path             = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
pythonpath = ["src"]

[tool.pylint.messages_control]
disable = ["all"]
enable = [
    "broad-exception-caught",   # W0718
    "cell-var-from-loop",       # W0640
    "cyclic-import",            # R0401
    "import-outside-toplevel",  # C0415
    "undefined-variable",       # E0602
]

# ---------------------------------------------------------------------------
# PyCodeKG / MemoryKG index configuration
# ---------------------------------------------------------------------------
[tool.pycodekg]
exclude = ["tests"]
include = ["src"]

[tool.dockg]
exclude = [
    "benchmarks", "bundles", "dist", "src", "scripts", "tests"
]

[tool.memorykg]
exclude = [
    "benchmarks", "bundles", "dist", "src", "scripts", "tests"
]

# ---------------------------------------------------------------------------
# Poe tasks
# ---------------------------------------------------------------------------
[tool.poe.tasks.docs]
help     = "Generate project documentation and user guide PDFs"
sequence = [
    { shell = "cd src && pdoc --o ../docs --logo ./logo.png memory_kg" },
]

[tool.poe.tasks.wiki]
help = "Generate and publish GitHub wiki from docs/"
cmd  = "python scripts/generate_wiki.py"

[tool.poe.tasks.wiki-preview]
help = "Preview wiki generation without publishing"
cmd  = "python scripts/generate_wiki.py --dry-run"
