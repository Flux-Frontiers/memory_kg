# pyproject.toml -- MemoryKG package configuration (PEP 621)
#
# Author: Eric G. Suchanek, PhD
#
# Build system : Poetry 2.x with PEP 621 [project] table
#
# Extras are user-facing features; dev tooling is a Poetry group, so it never
# ships in the wheel and cannot be pip-installed. See FLEET_STANDARDS.md.
#
# Quick install (pip)
# -------------------
#   pip install -e "."               core runtime only
#   pip install -e ".[viz]"          + Streamlit/Plotly/PyVis visualizer
#
# Quick install (poetry)
# ----------------------
#   poetry install                   core runtime only
#   poetry install --with dev        + pytest, ruff, ty, pre-commit, pdoc
#   poetry install --with kg         + the dockg/pycodekg CLIs (maintainer tooling)
#   poetry install --extras "viz"    + visualizer only
#   poetry install --all-extras --with dev,kg    full maintainer environment
#
# First-time setup
# ----------------
#   poetry install --with dev
#
# Run tests
# ---------
#   pytest                          uses pytest.ini (testpaths = tests/)
#   pytest -m "not slow"            skip slow tests
#   pytest --cov=memory_kg          with coverage
#
# Build KG indices (after doc/code changes)
# -----------------------------------------
#   memorykg build                  full rebuild (--update for incremental)

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "memory_kg", from = "src" }]

# ---------------------------------------------------------------------------
# PEP 621 project metadata
# ---------------------------------------------------------------------------
[project]
name = "memory-kg"
version = "0.8.0"
description = "A tool to build a semantically searchable knowledge graph from memories"
readme = "README.md"
license = "Elastic-2.0"
authors = [
    { name = "Eric G. Suchanek, PhD", email = "suchanek@flux-frontiers.com" }
]
keywords = ["knowledge-graph", "document-analysis", "markdown", "sqlite-vec", "sqlite", "semantic-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "click>=8.1.0,<9",
    "markdown-it-py>=3.0.0",
    # Upper-bounded: mcp 2.0 removed the bundled `mcp.server.fastmcp` module
    # (FastMCP was split out into the standalone `fastmcp` package) and rebuilt
    # mcp.server around new submodules. src/memory_kg/mcp_server.py imports
    # FastMCP at module scope, so an unbounded floor lets a clean install pull
    # 2.x and break `memorykg-mcp` at import time. Lift this only alongside a
    # port to the standalone fastmcp package.
    "mcp>=1.0.0,<2",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0.0",
    "rich>=14.3.3,<15",
    "safetensors>=0.5.0",
    "sentence-transformers>=5.4.1",
    "torch>=2.5.1",
    "transformers>=5.5.0,<6",
    # `[sqlite-vec]` only, deliberately not `[semantic]`. That extra bundles
    # numpy, rich, sentence-transformers, torch, transformers and sqlite-vec --
    # all of which are already declared directly above -- plus `lancedb`, which
    # was the last thing pulling the retired backend into a clean install.
    "kgmodule-utils[sqlite-vec]>=0.18.0",
]

[project.optional-dependencies]
viz = [
    "plotly>=5.14.0",
    "pyvis>=0.3.2",
    "streamlit>=1.35.0",
]
# Cross-KG siblings are never imported by memory_kg, so none are extras. The two
# whose CLIs this repo actually runs (doc-kg, pycode-kg) live in
# [tool.poetry.group.kg] below; the rest stay manual installs:
#   pip install 'ftree-kg @ git+https://github.com/Flux-Frontiers/ftree_kg.git'
#   pip install 'agent-kg @ git+https://github.com/Flux-Frontiers/agent_kg.git'

# Do not add an `all` aggregate extra. One used to sit here, re-listing every
# dev tool by name alongside the three viz packages, so the wheel advertised
# them as installable regardless of where the dev dependencies actually lived.
# `viz` is the only feature extra.

# ---------------------------------------------------------------------------
# Dev tooling (Poetry group, not a PEP 621 extra)
# ---------------------------------------------------------------------------
# `optional = true` keeps it out of a bare `poetry install`.
[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
detect-secrets = ">=1.5.0"
ty = ">=0.0.44"
pdoc = ">=14.0.0"
pre-commit = ">=4.5.1"
# >=9.0.3 is a security floor, not a preference: GHSA-6w46-j5rx-g56g.
pytest = ">=9.0.3"
pytest-cov = ">=5.0.0"
ruff = ">=0.4.0,<0.16"

# ---------------------------------------------------------------------------
# Maintainer tooling (Poetry group, not a PEP 621 extra)
# ---------------------------------------------------------------------------
# doc-kg and pycode-kg are tools this repo *runs*, not libraries it imports.
# Nothing under src/ imports either one; they are here because .mcp.json serves
# `dockg` and `pycodekg` MCP servers, which need those CLIs on PATH. Without a
# declaration a fresh clone gets dead MCP servers and no hint why.
#
# This is deliberately a Poetry group, not a [project.optional-dependencies]
# extra. A group is maintainer-facing: locked and installable, but never
# written into the wheel's metadata. `pip install memory-kg[...]` stays
# unaffected, because an extra would instead put sibling KG packages into the
# published dependency graph and couple their resolution together.
#
#   poetry install --with kg      # get the dockg / pycodekg CLIs into .venv/bin
#   poetry install                # default: group is optional, skipped
[tool.poetry.group.kg]
optional = true

[tool.poetry.group.kg.dependencies]
doc-kg = ">=0.22.0"
pycode-kg = ">=0.23.1"

[project.urls]
Homepage   = "https://github.com/Flux-Frontiers/memory_kg"
Repository = "https://github.com/Flux-Frontiers/memory_kg"

[project.scripts]
memorykg              = "memory_kg.cli.main:cli"
memorykg-analyze      = "memory_kg.cli.cmd_analyze:analyze"
memorykg-build        = "memory_kg.cli.cmd_build:build"
memorykg-build-graph  = "memory_kg.cli.cmd_build:build_graph"
memorykg-build-index  = "memory_kg.cli.cmd_build:build_index"
memorykg-mcp          = "memory_kg.mcp_server:main"
memorykg-pack         = "memory_kg.cli.cmd_query:pack"
memorykg-pipeline     = "memory_kg.cli.cmd_pipeline:pipeline"
memorykg-query        = "memory_kg.cli.cmd_query:query"
memorykg-snapshot     = "memory_kg.cli.cmd_snapshot:snapshot"
memorykg-viz          = "memory_kg.cli.cmd_viz:viz"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------
[tool.ruff]
line-length    = 100
target-version = "py312"
# ruff 0.16 formats Python code blocks embedded in Markdown as stable behaviour
# (0.15 gated it behind preview), so `ruff format --check .` starts rewriting
# prose docs. Keep docs out of its reach; the sibling KG repos carry the same
# exclusion.
exclude = [".claude", "*.md"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP",   # baseline: pycodestyle, pyflakes, isort, pyupgrade
    "B",                          # flake8-bugbear (latent bug patterns)
    "SIM",                        # flake8-simplify (clarity)
    "C4",                         # flake8-comprehensions
    "RET",                        # flake8-return
    "PIE",                        # flake8-pie
    "PERF",                       # perflint
    "FURB",                       # refurb (modernization)
    "RUF",                        # ruff-specific rules
    "PLE", "PLW",                 # pylint errors + warnings (skip C/R: too noisy)
]
ignore = [
    "E501",     # line-too-long (formatter handles)
    "RUF001",   # ambiguous unicode in strings (en-dashes are intentional)
    "RUF002",   # ambiguous unicode in docstrings (for example, "1–6" ranges)
    "SIM113",   # enumerate-for-loop (manual counter is occasionally clearer)
    "PLW0603",  # global-statement (MCP server uses an intentional module singleton)
]

[tool.ruff.lint.per-file-ignores]
# Benchmarks, scripts, and tests are research/eval/glue code -- looser rules.
"benchmarks/**"     = ["B", "SIM", "PERF", "FURB", "PLW", "RET", "C4", "RUF005", "RUF059", "E402"]
"scripts/**"        = ["B", "SIM", "PERF", "FURB", "PLW", "RET", "C4", "RUF005"]
"tests/**"          = ["B", "SIM", "PERF", "FURB", "PLW", "RET", "RUF059"]
"generate_wiki.py"  = ["B", "SIM", "PERF", "FURB", "PLW", "RET", "C4", "RUF005"]

[tool.ty.environment]
python-version = "3.12"
root = ["src"]

[tool.ty.rules]
# Be lenient about third-party stubs (mirrors mypy's ignore_missing_imports).
unresolved-import = "ignore"
# Whether a `ty: ignore` is *needed* depends on what happens to be installed.
# The suppressions on the tqdm monkey-patching in index.py are load-bearing when
# tqdm resolves and dead when it does not -- tqdm reaches this package only as a
# transitive of sentence-transformers, so both states are reachable. Deleting
# them to satisfy one install would break `ty` for the other. Mirrors doc-kg.
unused-ignore-comment = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
pythonpath = ["src"]

# ---------------------------------------------------------------------------
# PyCodeKG / MemoryKG index configuration
# ---------------------------------------------------------------------------
[tool.pycodekg]
exclude = ["tests"]
include = ["src"]

[tool.dockg]
exclude = [
    "benchmarks", "bundles", "dist", "src", "scripts", "tests"
]

[tool.memorykg]
exclude = [
    "benchmarks", "bundles", "dist", "src", "scripts", "tests"
]

# ---------------------------------------------------------------------------
# Poe tasks
# ---------------------------------------------------------------------------
[tool.poe.tasks.docs]
help     = "Generate project documentation and user guide PDFs"
sequence = [
    { shell = "cd src && pdoc --o ../docs --logo ./logo.png memory_kg" },
]

[tool.poe.tasks.wiki]
help = "Generate and publish GitHub wiki from docs/"
cmd  = "python scripts/generate_wiki.py"

[tool.poe.tasks.wiki-preview]
help = "Preview wiki generation without publishing"
cmd  = "python scripts/generate_wiki.py --dry-run"
